# Publishes via npm trusted publishing (OIDC) on a semver tag push.
# Trusted-publisher entry on npmjs.com: workflow filename `release.yml`.
# No npm token is stored or used. CI no longer publishes on pushes to main;
# releases happen only from a tag.

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Pin npm for trusted publishing
        run: npm install -g npm@^11.21.0
      - run: npm ci --ignore-scripts
      # Release gates run before anything is released or published. They mirror
      # the package's prepublishOnly, which --ignore-scripts skips.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
      - run: npm run build
      - run: npm run check:types
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
      - name: Publish to npm (trusted publishing)
        run: npm publish --provenance --access public --ignore-scripts
